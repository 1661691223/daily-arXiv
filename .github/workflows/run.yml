name: arXiv-daily-ai-enhanced

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arxiv-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set timezone to China Standard Time
        run: sudo timedatectl set-timezone Asia/Shanghai

      - name: Check current time
        run: date "+%Y-%m-%d %H:%M:%S %Z"

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync

      - name: Crawl arXiv papers
        id: crawl_step
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          CATEGORIES: ${{ vars.CATEGORIES }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
        run: |
          source .venv/bin/activate
          today=$(date -u "+%Y-%m-%d")
          echo "开始爬取 $today 的arXiv论文... / Starting to crawl $today arXiv papers..."

          # 删除今日旧文件（如果存在）
          rm -f "data/${today}.jsonl" || true

          cd daily_arxiv
          scrapy crawl arxiv -o ../data/${today}.jsonl

          if [ ! -f "../data/${today}.jsonl" ]; then
            echo "爬取失败，未生成数据文件 / Crawling failed, no data file generated"
            exit 1
          fi
          echo "crawl_date=$today" >> $GITHUB_OUTPUT

      - name: Check for duplicates
        id: dedup_check
        run: |
          source .venv/bin/activate
          echo "执行去重检查... / Performing intelligent deduplication check..."

          cd daily_arxiv
          set +e
          python daily_arxiv/check_stats.py
          dedup_exit_code=$?
          set -e

          echo "去重检查退出码: $dedup_exit_code / Dedup check exit code: $dedup_exit_code"
          echo "dedup_exit_code=$dedup_exit_code" >> $GITHUB_OUTPUT

          if [ "$dedup_exit_code" = "0" ]; then
            echo "has_new_content=true" >> $GITHUB_OUTPUT
          elif [ "$dedup_exit_code" = "1" ]; then
            echo "has_new_content=false" >> $GITHUB_OUTPUT
            echo "skip_reason=no_new_content" >> $GITHUB_OUTPUT
          else
            echo "has_new_content=false" >> $GITHUB_OUTPUT
            echo "skip_reason=processing_error" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: AI Enhancement Processing
        if: steps.dedup_check.outputs.has_new_content == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
        run: |
          source .venv/bin/activate
          today=${{ steps.crawl_step.outputs.crawl_date }}
          echo "开始AI增强处理... / Starting AI enhancement processing..."

          cd ai
          python enhance.py --data ../data/${today}.jsonl

          if [ $? -ne 0 ]; then
            echo "AI处理失败 / AI processing failed"
            exit 1
          fi
          echo "AI增强处理完成 / AI enhancement processing completed"

      - name: Convert to Markdown
        if: steps.dedup_check.outputs.has_new_content == 'true'
        env:
          LANGUAGE: ${{ vars.LANGUAGE }}
        run: |
          source .venv/bin/activate
          today=${{ steps.crawl_step.outputs.crawl_date }}
          echo "转换为Markdown格式... / Converting to Markdown format..."

          cd to_md
          AI_FILE="../data/${today}_AI_enhanced_${LANGUAGE}.jsonl"

          if [ -f "$AI_FILE" ]; then
            python convert.py --data "$AI_FILE"
          else
            echo "错误：未找到AI增强文件 / Error: AI enhanced file not found"
            echo "AI文件: $AI_FILE"
            exit 1
          fi

      - name: Update file list
        if: steps.dedup_check.outputs.has_new_content == 'true'
        run: |
          echo "更新文件列表... / Updating file list..."
          ls data/*.jsonl | sed 's|data/||' > assets/file-list.txt
          echo "文件列表更新完成 / File list updated"

      - name: Generate trending data
        if: steps.dedup_check.outputs.has_new_content == 'true'
        env:
          LANGUAGE: ${{ vars.LANGUAGE }}
          TRENDING_KEYWORDS: ${{ secrets.TRENDING_KEYWORDS }}
        run: |
          source .venv/bin/activate
          echo "生成热点趋势数据... / Generating trending data..."

          if [ -z "$TRENDING_KEYWORDS" ]; then
            TRENDING_KEYWORDS="agent,diffusion,transformer,llm"
            echo "⚠️  TRENDING_KEYWORDS not set, using default: $TRENDING_KEYWORDS"
          fi

          cd ai
          python generate_trending.py \
            --keywords "$TRENDING_KEYWORDS" \
            --days 7 \
            --data-dir ../data \
            --output ../assets/trending-data.json \
            --language "${LANGUAGE:-Chinese}"

          if [ $? -ne 0 ] || [ ! -f "../assets/trending-data.json" ]; then
            echo "❌ 趋势数据生成失败 / Trending data generation failed"
            exit 1
          fi
          echo "✅ 趋势数据生成完成 / Trending data generation completed"

      - name: Generate password hash and inject into config
        if: steps.dedup_check.outputs.has_new_content == 'true'
        env:
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
        run: |
          echo "🔐 Generating password hash for authentication..."

          if [ -z "$ACCESS_PASSWORD" ]; then
            echo "⚠️  ACCESS_PASSWORD not set; password protection DISABLED"
            PASSWORD_HASH="DISABLED_NO_PASSWORD_SET_IN_SECRETS"
          else
            PASSWORD_HASH=$(printf %s "$ACCESS_PASSWORD" | openssl dgst -sha256 -hex | awk '{print $2}')
            echo "✅ Password hash generated successfully"
          fi

          if [ -f "js/auth-config.js" ]; then
            sed -i "s/PLACEHOLDER_PASSWORD_HASH/$PASSWORD_HASH/" js/auth-config.js
            echo "✅ Password hash injected into js/auth-config.js"
          else
            echo "❌ ERROR: js/auth-config.js not found!"
            exit 1
          fi

      - name: Inject repository info into data-config.js
        if: steps.dedup_check.outputs.has_new_content == 'true'
        run: |
          echo "注入仓库信息到 data-config.js... / Injecting repository info into data-config.js..."
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          sed -i "s/PLACEHOLDER_REPO_OWNER/$REPO_OWNER/g" js/data-config.js
          sed -i "s/PLACEHOLDER_REPO_NAME/$REPO_NAME/g" js/data-config.js
          echo "✅ 仓库信息已注入到 js/data-config.js / Repository info injected into js/data-config.js"

      - name: Commit code changes to main branch
        if: steps.dedup_check.outputs.has_new_content == 'true'
        run: |
          git config user.email "${{ secrets.EMAIL }}"
          git config user.name "${{ secrets.NAME }}"

          # 添加代码变更，排除数据类文件
          git add js/data-config.js js/auth-config.js .github/
          git add -A
          git reset -- data/* assets/file-list.txt assets/trending-data.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "没有代码变更需要提交 / No code changes to commit"
          else
            git commit -m "chore: update configs and artifacts"
            echo "代码变更已提交到 main 分支 / Code changes committed to main branch"
          fi

      - name: Push code changes to main branch
        if: steps.dedup_check.outputs.has_new_content == 'true'
        run: |
          git push origin HEAD:main

      - name: Checkout data branch
        if: steps.dedup_check.outputs.has_new_content == 'true'
        uses: actions/checkout@v4
        with:
          ref: data
          path: data_repo
          fetch-depth: 0

      - name: Update data branch contents
        if: steps.dedup_check.outputs.has_new_content == 'true'
        run: |
          echo "准备并更新 data 分支内容... / Preparing and updating data branch contents..."
          mkdir -p data_repo/data data_repo/assets
          cp -r data/* data_repo/data/ 2>/dev/null || true
          cp assets/file-list.txt assets/trending-data.json data_repo/assets/ 2>/dev/null || true

          cd data_repo
          git config user.email "${{ secrets.EMAIL }}"
          git config user.name "${{ secrets.NAME }}"
          git add -A
          if git diff --staged --quiet; then
            echo "没有数据变更需要提交 / No data changes to commit"
          else
            today=${{ steps.crawl_step.outputs.crawl_date }}
            git commit -m "update: ${today} arXiv papers"
            git push origin HEAD:data
            echo "数据变更已推送到 data 分支 / Data changes pushed to data branch"
          fi

      - name: Summary
        run: |
          if [ "${{ steps.dedup_check.outputs.has_new_content }}" = "true" ]; then
            echo "✅ 工作流完成：发现并处理了新内容 / Workflow completed: processed new content"
          else
            echo "ℹ️ 工作流完成：去重后无新内容 / Workflow completed: no new content"
          fi
